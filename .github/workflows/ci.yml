name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# One run per branch at a time, in the order of the pushes, so that a run of an older push to main
# never publishes after a newer one (spec publishing). A running run is not cancelled; a waiting run
# is replaced by the run of a newer push, as GitHub does within a concurrency group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  specs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate OpenSpec specs and changes
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npx --yes @fission-ai/openspec@2.0.0 validate --all --strict --no-interactive

  # The steps of scripts/verify-local.sh after the OpenSpec validation, in the same order.
  # This job does not wait for `specs`: both always run, so one run shows every failure.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm in the version package.json pins
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Static analysis
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      - name: Build the site
        run: pnpm run build

      - name: Install the browser of the browser tests
        run: pnpm --filter app exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm run test:e2e

      # The build the browser tests just checked, as the artifact the job `deploy` publishes
      # (spec publishing). It runs on pull requests too, so that this step is exercised before a
      # merge; only the job `deploy` is limited to pushes to main.
      - name: Upload the tested site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/swiss-votation-visualisation

  # The pipeline's checks, steps 8 to 11 of scripts/verify-local.sh. Independent of the other two
  # jobs. uv installs the Python of pipeline/.python-version and the packages of pipeline/uv.lock.
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no tag per major version; this is the newest release on 2026-11-14.
        uses: astral-sh/setup-uv@v10.3.3

      - name: Check formatting of the pipeline
        run: uv run --directory pipeline --locked ruff format --check .

      - name: Lint the pipeline
        run: uv run --directory pipeline --locked ruff check .

      - name: Static analysis of the pipeline
        run: uv run --directory pipeline --locked mypy

      - name: Unit tests of the pipeline
        run: uv run --directory pipeline --locked pytest

  # Publishes the site on GitHub Pages (spec publishing): the build the job `build` uploaded after
  # its browser tests, not a second build, and only for a push to main whose three jobs all
  # passed. On a pull request this job shows as skipped. Deployments cannot overlap: the
  # workflow's concurrency runs one run of main at a time.
  deploy:
    needs: [specs, build, pipeline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish the tested site
        id: deployment
        uses: actions/deploy-pages@v5
