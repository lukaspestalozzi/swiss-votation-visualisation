[project]
name = "pipeline"
version = "0.0.0"
description = "Turns the public sources into the data files of the app, and checks them."
requires-python = ">=3.13"
dependencies = ["polars>=2.1.0"]

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.5"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
# As Prettier's print width for the rest of the repository.
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
